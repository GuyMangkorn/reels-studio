<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@600;700&display=swap">
<style>
/* Fixed layout for every user storyboard review page (docs/mark-storyboard-workflow.md#user-storyboard-review-page).
   One page per deliverable, three tabs: storyboard, draft, final. Every tab shows the same shot rows; only the media
   column and the accept step differ. Edit this template, never a published page. */
:root {
  --bg: #eef0ef; --surface: #f8f9f8; --line: #d5dad8; --fg: #1c2321; --muted: #5f6b67;
  --accent: #b5641c; --ok: #2f7a4a; --ok-bg: #e2f0e6; --change: #b23a2e; --flag-bg: #f6ead9;
  --font-display: "Noto Serif Thai", Georgia, serif;
  --font-body: "IBM Plex Sans Thai", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a19; --surface: #1d2422; --line: #303a37; --fg: #e3e8e6; --muted: #98a6a1;
  --accent: #e39a4f; --ok: #6cc58c; --ok-bg: #1f3327; --change: #ef7c6e; --flag-bg: #33291d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a19; --surface: #1d2422; --line: #303a37; --fg: #e3e8e6; --muted: #98a6a1;
  --accent: #e39a4f; --ok: #6cc58c; --ok-bg: #1f3327; --change: #ef7c6e; --flag-bg: #33291d; color-scheme: dark }

[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; display: grid; gap: 24px; }
header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 21px; margin: 0; text-wrap: balance; }
.lede { max-width: 68ch; margin: 0; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); }
.facts b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.btn:focus-visible, textarea:focus-visible, .seg button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.armed { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.store { font-size: 12px; color: var(--muted); }

/* Accept status: one meter per stage, then the store state and copy button. */
.status { display: grid; gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.meters { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 8px 18px; align-items: center; }
.meters .k { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.meter { display: grid; gap: 4px; }
.meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.meter b { font-variant-numeric: tabular-nums; }
.meter .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }
.status .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.status .sp { flex: 1; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--fg); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tab { font: inherit; font-size: 15px; font-weight: 500; padding: 8px 16px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: transparent; color: var(--muted); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.tab .n { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.tab.full .n::after { content: " ✓"; }
.tabnote { margin: 0; font-size: 13px; color: var(--muted); max-width: 72ch; }

section.qs { display: grid; gap: 12px; }
.q { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 12px 20px; padding: 14px 16px; background: var(--flag-bg); border-radius: 6px; }
.q p { margin: 0; }
.q .qid { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }

#beats { display: grid; gap: 28px; }
.beat { display: grid; gap: 0; }
.beat-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding-bottom: 8px; border-bottom: 1px solid var(--fg); }
.beat-head .bid { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
/* Look frame (W2): one painted still per location, shown on every beat that uses it. */
.beat-head { align-items: center; }
.look { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; color: var(--muted); max-width: 46ch; }
.look img { width: 54px; aspect-ratio: 9 / 16; object-fit: cover; border: 1px solid var(--line); border-radius: 3px; cursor: zoom-in; background: var(--surface); flex: none; }
.look .lk { font-family: var(--font-mono); font-size: 11px; color: var(--accent); display: block; }
#beats.no-media .cols, #beats.no-media .shot { grid-template-columns: 104px minmax(0, 1.2fr) minmax(0, 1.8fr) minmax(0, 1.2fr); }
.cols, .shot { display: grid; grid-template-columns: 104px minmax(0, 1.1fr) minmax(0, 1.4fr) minmax(0, 1.1fr) minmax(0, 1.2fr); gap: 0 16px; }
.cols { font-size: 12px; color: var(--muted); padding: 8px 0; border-bottom: 1px solid var(--line); }
.shot { padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.shot > div { min-width: 0; }
.shot.accepted { background: linear-gradient(90deg, var(--ok-bg), transparent 35%); }
.sid { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 4px; margin-top: 8px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--line); box-sizing: border-box; }
.dots span.ok { background: var(--ok); border-color: var(--ok); }
.dots span.change { border-color: var(--change); }
.pin { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--ok-bg); color: var(--ok); }
.title { font-weight: 600; margin-bottom: 4px; }
.vo { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.vo li { font-size: 14px; }
.vo .who { font-size: 11px; color: var(--muted); }
.vo.none { color: var(--muted); font-size: 13px; }
.seen { margin: 0; }
.flag { margin-top: 6px; padding: 6px 8px; font-size: 13px; background: var(--flag-bg); border-left: 3px solid var(--accent); }
.sound { font-size: 13px; color: var(--muted); margin-top: 8px; }
.media { font-size: 12px; color: var(--muted); }
.lbl { display: none; }

.review { display: grid; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; width: max-content; }
.seg button { font: inherit; font-size: 13px; padding: 4px 12px; border: 0; background: var(--surface); color: var(--fg); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-v="ok"] { background: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="change"] { background: var(--change); color: var(--surface); }
textarea { font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; min-height: 52px; resize: vertical; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--fg); }
.saved, .prev, .wait { font-size: 11px; color: var(--muted); min-height: 1em; }
.wait { font-size: 13px; }
/* Answers carry over while an item's hash is unchanged; a changed item shows its old answer and asks again. */
.prev.stale { color: var(--change); }
.chgmark:not(:empty) { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 999px; background: var(--flag-bg); color: var(--change); }
.chgtxt { display: none; margin-top: 6px; padding: 6px 8px; font-size: 13px; background: var(--flag-bg); border-left: 3px solid var(--change); }
.shot.changed .chgtxt { display: block; }
.todo { font-size: 13px; }
.shot[hidden], .beat[hidden] { display: none; }

.clip { display: grid; gap: 6px; }
/* Final tab: one video, the file that will be published, and one verdict for the whole video. */
.final { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; padding: 16px 0; }
.final video { max-height: 78vh; max-width: 100%; border-radius: 6px; background: #0d1110; border: 1px solid var(--line); display: block; }
.final .side { flex: 1 1 280px; display: grid; gap: 10px; align-content: start; }
.final .side p { margin: 0; }
.final .file { font-family: var(--font-mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.clip video { width: 140px; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 4px; background: #0d1110; border: 1px solid var(--line); display: block; object-fit: cover; cursor: pointer; }
.clip .row { display: flex; gap: 6px; flex-wrap: wrap; }
.clip .btn { font-size: 12px; padding: 3px 8px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-block: 4px 6px; }
.thumbs figure { margin: 0; display: grid; gap: 2px; }
.thumbs img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border: 1px solid var(--line); border-radius: 3px; cursor: zoom-in; background: var(--surface); }
.q .thumbs { grid-template-columns: minmax(0, 360px); }
.q .thumbs img { aspect-ratio: auto; }
.thumbs figcaption { font-size: 10px; line-height: 1.3; color: var(--muted); }
.pvlabel { font-size: 10px; line-height: 1.35; color: var(--muted); margin-top: 4px; }

section.els { display: grid; gap: 12px; }
.el-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.el-grid figure { margin: 0; display: grid; gap: 6px; }
.el-grid img { width: 100%; height: 220px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; background: var(--surface); }
.el-grid figcaption { font-size: 12px; color: var(--muted); }
dialog { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 94vh; }
dialog::backdrop { background: rgba(0,0,0,.75); }
dialog img, dialog video { max-width: 96vw; max-height: 88vh; display: block; }
dialog button { margin-top: 8px; }
.note { font-size: 13px; color: var(--muted); max-width: 72ch; margin: 0; }

@media (max-width: 860px) {
  .cols { display: none; }
  .shot { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .lbl { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .q { grid-template-columns: minmax(0, 1fr); }
  .meters { grid-template-columns: minmax(0, 1fr); }
  .tab { padding: 8px 10px; font-size: 14px; }
  #beats.no-media .shot { grid-template-columns: minmax(0, 1fr); }
  .look { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .meter .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="facts" id="facts"></div>
  </header>

  <div class="status" role="status">
    <div class="meters" id="meters"></div>
    <div class="foot">
      <span class="store" id="store">กำลังเชื่อมที่เก็บคำตอบ…</span>
      <span class="todo" id="todo"></span>
      <span class="sp"></span>
      <button class="btn" id="acceptAll" type="button">ผ่านทั้งหมด</button>
      <button class="btn" id="only" type="button" aria-pressed="false">ดูเฉพาะที่ต้องตอบ</button>
      <button class="btn" id="copy" type="button">คัดลอกคำตอบทั้งหมด</button>
    </div>
  </div>

  <section class="qs" id="qs" aria-labelledby="qh" hidden>
    <h2 id="qh">คำถามที่ต้องให้คุณเลือก</h2>
    <div id="questions"></div>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="tabnote" id="tabnote"></p>
  <div id="beats"></div>

  <section class="els" id="els" aria-labelledby="elh" hidden>
    <h2 id="elh">ภาพอ้างอิงตัวละครและฉาก</h2>
    <p class="note" id="elnote"></p>
    <div class="el-grid" id="elgrid"></div>
  </section>

  <p class="note" id="source"></p>
</div>

<dialog id="zoom"><img id="zoomImg" alt=""><video id="zoomVid" controls playsinline muted hidden></video><button class="btn" id="zoomClose" type="button">ปิด</button></dialog>

<script id="page-data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("page-data").textContent);
const FPS = D.fps || 30;
const REV = D.revision;
const PREV = D.previousVerdicts || {};
const STAGES = ["board", "draft", "final"];
// Shots are reviewed on the storyboard and draft tabs; the Final tab has one verdict for the whole published file.
const SHOT_STAGES = ["board", "draft"];
const FINAL_KEY = "video@final";
const NAME = { board: "สตอรีบอร์ด", draft: "Draft", final: "Final" };
const NOTE = {
  board: "อ่านแผนของแต่ละช็อต: เสียงพากย์ สิ่งที่เห็น กล้อง ถ้าผ่าน เอเจนต์ จะทำ draft ของช็อตนั้นต่อ",
  draft: "ดูจังหวะ ท่าทาง มุมกล้อง จาก draft (ภาพครึ่งขนาด ทำได้เร็ว) ถ้าผ่าน เอเจนต์ จะวาดภาพจริงต่อ",
  draftCut: "ดูคลิป draft เต็มรอบเดียว (ภาพครึ่งขนาด) แล้วกด \"แก้\" เฉพาะช็อตที่ต้องแก้ พร้อมโน้ต (บอกเวลาได้) ช็อตที่เหลือกด \"ผ่านทั้งหมด\" ได้ แล้ว เอเจนต์ จะ render ไฟล์ส่งให้ดูในแท็บ Final",
  final: "ดูคลิปเต็มที่จะ publish (ไฟล์เดียวกับที่จะส่ง) ถ้าผ่าน ทุกช็อตจะถูกปักและไฟล์นี้ไปที่โฟลเดอร์ publish ถ้าต้องแก้ กด \"แก้\" แล้วเขียนเวลาและสิ่งที่ต้องแก้",
};

const fmt = f => { const s = f / FPS; const m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };
const len = (a, b) => ((b - a) / FPS).toFixed(1) + " วิ";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Verdicts: key "<shot>@<stage>" (entry in reviews.json); questions keep "<Qid>".
// Each verdict stores the hash of what it judged (build.py): the shot's storyboard text, the clip file or the question.
// It carries over to later revisions while that hash is unchanged; otherwise it moves to `stale` and the item asks again.
const state = {}, stale = {};
const clipOf = (s, stage) => (s.clips || {})[stage];
const clipId = c => c && (c.hash || c.src);
const fmtTime = sec => { const s = Math.max(0, Number(sec) || 0); return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`; };
const verdictKey = (id, stage) => stage ? `${id}@${stage}` : id;
const shotOf = id => D.shots.find(x => x.id === id);
function expected(key) {
  if (key === FINAL_KEY) return D.finalCut?.hash;
  const [id, stage] = key.split("@");
  if (!stage) return (D.questions || []).find(q => q.id === id)?.hash;
  const s = shotOf(id);
  return s && (stage === "board" ? s.hash : clipOf(s, stage)?.hash);
}
const current = (s, stage) => { const r = state[verdictKey(s.id, stage)]; return r && (stage === "board" || r.clip === clipId(clipOf(s, stage))) ? r : null; };
const accepted = (s, stage) => current(s, stage)?.status === "ok";
const needs = (s, stage) => SHOT_STAGES.includes(stage) && (stage === "board" || clipOf(s, stage)) && !current(s, stage)?.status;
const finalVerdict = () => { const r = state[FINAL_KEY]; return D.finalCut && r && r.clip === D.finalCut.hash ? r : null; };
const said = p => `${p.status === "ok" ? "ผ่าน" : p.status === "change" ? "แก้" : "ยังไม่เลือก"}${p.note ? " · " + p.note : ""}`;
let tab = "board", onlyOpen = false;
// Verdicts live in the Claude Artifact's db (docs reviews/<key>) when the page is published as an artifact;
// otherwise in reviews.json beside review-rows.json, served by serve.py at /api/reviews.
// `pending` holds keys edited here and not yet saved, so an incoming update never overwrites them.
let online = false, db = null;
const pending = new Set();
const put = (key, v) => db ? db.doc("reviews/" + key).set(v)
  : fetch("api/reviews/" + encodeURIComponent(key), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(v) })
    .then(r => { if (!r.ok) throw new Error(r.status); });

function reviewHTML(id, stage, s, placeholder = "หมายเหตุ (ถ้ามี)") {
  const key = verdictKey(id, stage);
  const p = stage === "board" || !stage ? PREV[id] : null;
  if (stage === "draft" && !clipOf(s, stage)) return `<div class="wait">ยังไม่มี${NAME[stage]} จะขึ้นเมื่อ เอเจนต์ render เสร็จ</div>`;
  return `<div class="review" data-key="${esc(key)}">
    <div class="seg" role="group" aria-label="ผลตรวจ ${esc(key)}">
      <button type="button" data-v="ok" aria-pressed="false">ผ่าน${stage ? " " + NAME[stage] : ""}</button>
      <button type="button" data-v="change" aria-pressed="false">แก้</button>
    </div>
    <textarea id="note-${esc(key)}" placeholder="${esc(placeholder)}" aria-label="หมายเหตุ ${esc(key)}"></textarea>
    <div class="saved" id="saved-${esc(key)}"></div>
    <div class="prev" id="prev-${esc(key)}" data-legacy="${p ? esc(`รอบ ${D.previousRevision || "ก่อน"}: ${said({ status: p[0], note: p[1] })}`) : ""}"></div>
  </div>`;
}
function thumbs(list) {
  return `<div class="thumbs">${list.map(i => `<figure><img src="${esc(i.src)}" alt="${esc(i.caption)}" loading="lazy"><figcaption>${esc(i.caption)}</figcaption></figure>`).join("")}</div>`;
}
function clipHTML(c, stage) {
  // Draft or final cut (clips.mjs --full [--draft]): one video for the whole tab; each row jumps into it.
  if (c.cut) return `<div class="clip"><div class="row">
      <button class="btn play" type="button" data-video="${esc(c.src)}" data-in="${c.in ?? 0}" data-out="${c.out ?? ""}">▶ ช็อตนี้ในคลิปเต็ม</button>
    </div><div class="pvlabel">${stage === "draft" ? "draft ครึ่งขนาด" : "ภาพจริง"} · ${fmtTime(c.in)}–${fmtTime(c.out)}</div></div>`;
  return `<div class="clip">
    <video src="${esc(c.src)}" muted playsinline loop preload="metadata" aria-label="คลิป ${NAME[stage]}"></video>
    <div class="row">
      <button class="btn play" type="button" data-video="${esc(c.src)}" data-in="${c.in ?? 0}" data-out="${c.out ?? ""}">▶ ช็อตนี้</button>
      <button class="btn play" type="button" data-video="${esc(c.src)}">▶ รอยต่อ</button>
    </div>
    <div class="pvlabel">${stage === "draft" ? "draft ครึ่งขนาด" : "ภาพจริง"} · รอยต่อ = ช็อตก่อนและหลัง ±1 วิ</div>
  </div>`;
}
function mediaCell(s, stage) {
  const c = clipOf(s, stage);
  return c ? clipHTML(c, stage) : `<span class="wait">ยังไม่มีคลิป</span>`;
}
function lookHTML(b) {
  const l = b.look && (D.looks || {})[b.look];
  if (!l) return "";
  return `<div class="look"><img src="${esc(l.src)}" alt="${esc(l.caption || b.look)}" loading="lazy"><span><span class="lk">look frame · ${esc(b.look)}</span>${esc(l.caption || "")}</span></div>`;
}
const dots = s => `<div class="dots" aria-label="ผ่านแล้ว">${SHOT_STAGES.map(k => { const r = current(s, k); return `<span class="${r?.status || ""}" title="${NAME[k]}"></span>`; }).join("")}</div>`;

function renderStatic() {
  const total = D.shots.length && !D.untimed ? D.shots[D.shots.length - 1].end - D.shots[0].start : 0;
  document.getElementById("eyebrow").textContent = D.eyebrow || `${D.deliverable} · ${REV}`;
  document.getElementById("h1").textContent = D.title;
  document.getElementById("lede").textContent = D.lede || "";
  const facts = [["ช็อต", String(D.shots.length)], ...(D.untimed ? [] : [["ความยาว", (total / FPS).toFixed(1) + " วิ" + (D.timingEstimated ? " (ประมาณ)" : "")]]), ...(D.facts || [])];
  document.getElementById("facts").innerHTML = facts.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("");
  document.getElementById("source").textContent = `หน้านี้เป็นมุมมองสำหรับอ่าน ต้นฉบับของการกำหนดช็อตอยู่ใน ${D.source} (${REV})`;
  document.getElementById("meters").innerHTML = `<span class="k">ผ่านแล้ว</span>` + STAGES.map(k =>
    `<div class="meter"><div class="row"><span>${NAME[k]}</span><b id="m-${k}"></b></div><div class="bar"><i id="b-${k}"></i></div></div>`).join("");
  document.getElementById("tabs").innerHTML = STAGES.map(k =>
    `<button class="tab" role="tab" type="button" id="tab-${k}" data-tab="${k}" aria-selected="false">${NAME[k]} <span class="n" id="t-${k}"></span></button>`).join("");
  if ((D.questions || []).length) {
    document.getElementById("qs").hidden = false;
    document.getElementById("questions").innerHTML = D.questions.map(q =>
      `<div class="q"><div><div class="qid">${esc(q.id)}</div><p>${esc(q.question)}</p>${q.detail ? `<p class="note">${esc(q.detail)}</p>` : ""}${(q.images || []).length ? thumbs(q.images) : ""}</div>${reviewHTML(q.id, null)}</div>`).join("");
  }
  if ((D.elements || []).length) {
    document.getElementById("els").hidden = false;
    document.getElementById("elnote").textContent = D.elementsNote || "";
    document.getElementById("elgrid").innerHTML = D.elements.map(e => `<figure><img src="${esc(e.src)}" alt="${esc(e.caption)}"><figcaption>${esc(e.caption)}</figcaption></figure>`).join("");
  }
}

// The shot table: the same rows on every tab; the media column and the accept step follow the tab.
function renderRows() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  document.getElementById("only").hidden = document.getElementById("acceptAll").hidden = tab === "final";
  if (tab === "final") return renderFinal();
  const cut = tab === "draft" && D.draftCut;
  document.getElementById("tabnote").innerHTML = esc(cut ? NOTE.draftCut : NOTE[tab])
    + (cut ? ` <button class="btn play" type="button" data-video="${esc(cut.src)}">▶ ดูทั้งคลิป</button>` : "");
  // The storyboard tab is text only: the look of each location sits in its beat header.
  const media = tab !== "board", mediaHead = "คลิป " + NAME[tab];
  document.getElementById("beats").classList.toggle("no-media", !media);
  const cols = `<div class="cols"><div>ช็อต / เวลา</div><div>ชื่อ + เสียงพากย์</div><div>สิ่งที่เห็น</div>${media ? `<div>${mediaHead}</div>` : ""}<div>ตรวจ ${NAME[tab]}</div></div>`;
  document.getElementById("beats").innerHTML = D.beats.map(b => {
    const rows = D.shots.filter(s => s.beat === b.id).map(s => `
      <div class="shot${accepted(s, tab) ? " accepted" : ""}" id="${esc(s.id)}">
        <div><div class="sid">${esc(s.id)}</div>${D.untimed ? "" : `<div class="time">${fmt(s.start)} · ${len(s.start, s.end)}</div>`}${dots(s)}${s.pinned ? `<span class="pin">🔒 ปักแล้ว</span>` : ""}<span class="chgmark"></span></div>
        <div><div class="title">${esc(s.title)}</div>${(s.vo || []).length
          ? `<ul class="vo">${s.vo.map(([w, l]) => `<li>${w ? `<span class="who">${esc(w)}</span><br>` : ""}${esc(l)}</li>`).join("")}</ul>`
          : `<div class="vo none">ไม่มีเสียงพากย์</div>`}</div>
        <div><span class="lbl">สิ่งที่เห็น</span><p class="seen">${esc(s.seen)}</p>${s.flag ? `<div class="flag">${esc(s.flag)}</div>` : ""}${s.changed && tab === "board" ? `<div class="chgtxt">เปลี่ยน: ${esc(s.changed)}</div>` : ""}${s.sound ? `<div class="sound">เสียง: ${esc(s.sound)}</div>` : ""}</div>
        ${media ? `<div class="media"><span class="lbl">${mediaHead}</span>${mediaCell(s, tab)}</div>` : ""}
        <div><span class="lbl">ตรวจ ${NAME[tab]}</span>${reviewHTML(s.id, tab, s)}</div>
      </div>`).join("");
    return `<section class="beat" aria-label="${esc(b.id)}"><div class="beat-head"><h2>${esc(b.name)}</h2><span class="bid">${esc(b.id)}</span>${lookHTML(b)}</div>${cols}${rows}</section>`;
  }).join("");
  document.querySelectorAll("#beats .review").forEach(box => paint(box.dataset.key));
  filter(); count();
}
// Final tab: the delivery render itself (render.mjs --rows writes finalCut), watched whole, one verdict.
function renderFinal() {
  document.getElementById("tabnote").textContent = NOTE.final;
  const beats = document.getElementById("beats");
  beats.classList.remove("no-media");
  const f = D.finalCut;
  beats.innerHTML = f ? `<section class="final" aria-label="Final">
      <video src="${esc(f.src)}" controls playsinline preload="metadata" aria-label="คลิป final ที่จะ publish"></video>
      <div class="side">
        <h2>คลิปที่จะ publish</h2>
        <p class="note">ดูให้จบทั้งคลิป ถ้าผ่าน เอเจนต์ จะปักทุกช็อตแล้วส่งไฟล์นี้ไปที่โฟลเดอร์ publish</p>
        ${f.label ? `<p class="file">${esc(f.label)}</p>` : ""}
        ${reviewHTML("video", "final", null, "ถ้าแก้ บอกเวลาและสิ่งที่ต้องแก้ เช่น 0:12 ซับทับหน้า")}
      </div>
    </section>`
    : `<p class="wait">ยังไม่มีคลิป final จะขึ้นเมื่อทุกช็อตผ่าน draft และ render ไฟล์ส่งเสร็จ</p>`;
  if (f) paint(FINAL_KEY);
  count();
}
// "ดูเฉพาะที่ต้องตอบ" hides the rows already answered on this tab; applied on toggle and tab change, not per click.
function filter() {
  if (tab === "final") return;
  document.querySelectorAll("#beats .shot").forEach(row => { row.hidden = onlyOpen && !needs(shotOf(row.id), tab); });
  document.querySelectorAll("#beats .beat").forEach(b => { b.hidden = onlyOpen && !b.querySelector(".shot:not([hidden])"); });
  const btn = document.getElementById("only");
  btn.setAttribute("aria-pressed", String(onlyOpen));
  btn.textContent = onlyOpen ? "ดูทั้งหมด" : "ดูเฉพาะที่ต้องตอบ";
}

function paint(key) {
  const box = document.querySelector(`.review[data-key="${CSS.escape(key)}"]`);
  if (!box) return;
  const [id, stage] = key.split("@");
  const s = D.shots.find(x => x.id === id);
  const r = s && stage ? current(s, stage) || {} : state[key] || {};
  box.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === r.status)));
  const ta = document.getElementById("note-" + key);
  if (document.activeElement !== ta) ta.value = r.note || "";
  document.getElementById("saved-" + key).textContent = r.updatedAt ? "บันทึกแล้ว " + new Date(r.updatedAt).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short" }) : "";
  const st = !r.status && stale[key], pv = document.getElementById("prev-" + key);
  pv.classList.toggle("stale", !!st);
  pv.textContent = st ? `เปลี่ยนหลังคุณตอบ · คำตอบเดิม (รอบ ${st.rev || "ก่อน"}): ${said(st)}`
    : r.prev ? `รอบ ${r.prev.rev || "ก่อน"}: ${said(r.prev)}` : pv.dataset.legacy;
  const row = box.closest(".shot");
  if (row) {
    row.classList.toggle("accepted", r.status === "ok");
    row.classList.toggle("changed", !!st);
    row.querySelector(".chgmark").textContent = st ? "เปลี่ยน" : "";
    row.querySelector(".dots").outerHTML = dots(s);
  }
}
function count() {
  const n = D.shots.length;
  SHOT_STAGES.forEach(k => {
    const ok = D.shots.filter(s => accepted(s, k)).length;
    document.getElementById("m-" + k).textContent = `${ok}/${n}`;
    document.getElementById("b-" + k).style.width = (n ? 100 * ok / n : 0) + "%";
    document.getElementById("t-" + k).textContent = `${ok}/${n}`;
    document.getElementById("tab-" + k).classList.toggle("full", n > 0 && ok === n);
  });
  const fv = finalVerdict()?.status;
  const ftext = !D.finalCut ? "ยังไม่มี" : fv === "ok" ? "ผ่าน" : fv === "change" ? "แก้" : "รอดู";
  document.getElementById("m-final").textContent = ftext;
  document.getElementById("b-final").style.width = fv === "ok" ? "100%" : "0%";
  document.getElementById("t-final").textContent = ftext;
  document.getElementById("tab-final").classList.toggle("full", fv === "ok");
  if (tab === "final") {
    document.getElementById("todo").textContent = !D.finalCut ? "Final: ยังไม่มีคลิป" : fv ? `Final: ${ftext}` : "Final: รอคำตอบ" + (stale[FINAL_KEY] ? " · ไฟล์เปลี่ยนหลังคุณตอบ" : "");
    return;
  }
  const need = D.shots.filter(s => needs(s, tab)).length;
  const chg = D.shots.filter(s => needs(s, tab) && stale[verdictKey(s.id, tab)]).length;
  document.getElementById("todo").textContent = `${NAME[tab]}: รอคำตอบ ${need} ช็อต` + (chg ? ` · เปลี่ยนหลังคุณตอบ ${chg}` : "");
  const all = document.getElementById("acceptAll");
  if (armed && armed.tab === tab && armed.need === need) return;
  disarm();
  all.textContent = need ? `ผ่านทั้งหมด (${need})` : "ผ่านทั้งหมด";
  all.disabled = !need;
}

async function save(key) {
  const r = state[key];
  const [id, stage] = key.split("@");
  const s = D.shots.find(x => x.id === id);
  r.updatedAt = new Date().toISOString();
  r.clip = key === FINAL_KEY ? D.finalCut?.hash || "" : s && stage && stage !== "board" ? clipId(clipOf(s, stage)) || "" : "";
  if (!r.prev && stale[key]) r.prev = stale[key];
  paint(key); count();
  if (!online) { document.getElementById("saved-" + key).textContent = "ยังไม่ได้บันทึกขึ้นที่เก็บ ใช้ปุ่มคัดลอกแทน"; pending.delete(key); return; }
  try {
    await put(key, { shot: id, stage: stage || "", status: r.status || "", note: r.note || "", rev: REV, hash: expected(key) || "",
      clip: r.clip, updatedAt: r.updatedAt, ...(r.prev ? { prev: r.prev } : {}) });
    document.getElementById("saved-" + key).textContent = "";
  } catch (e) {
    document.getElementById("saved-" + key).textContent = "บันทึกไม่สำเร็จ ใช้ปุ่มคัดลอกแทน";
  }
  pending.delete(key);
}

// "ผ่านทั้งหมด": every shot on this tab with no answer yet passes; shots marked "แก้" keep their answer.
// The first click arms the button and the second, within 5 s, applies it: the artifact's
// sandboxed frame may block confirm(), which would make the button do nothing.
var armed = null;  // var: count() may run before this line on load
function disarm() {
  if (!armed) return;
  clearTimeout(armed.timer);
  armed = null;
  document.getElementById("acceptAll").classList.remove("armed");
}
function acceptAll() {
  const open = D.shots.filter(s => needs(s, tab));
  if (!open.length) return;
  const all = document.getElementById("acceptAll");
  if (!armed || armed.tab !== tab) {
    disarm();
    armed = { tab, need: open.length, timer: setTimeout(() => { disarm(); count(); }, 5000) };
    all.classList.add("armed");
    all.textContent = `กดอีกครั้ง: ผ่าน ${open.length} ช็อตที่ยังไม่ตอบ (ช็อตที่กด "แก้" ไม่เปลี่ยน)`;
    return;
  }
  disarm();
  open.forEach(s => {
    const key = verdictKey(s.id, tab);
    state[key] = { ...(current(s, tab) || {}), status: "ok" };
    pending.add(key);
    save(key);
  });
  filter();
}

function setTab(k) {
  if (!STAGES.includes(k)) return;
  tab = k;
  try { localStorage.setItem("sb-tab", k); } catch {}
  renderRows();
}

function wire() {
  document.addEventListener("click", e => {
    const t = e.target.closest(".tab");
    if (t) { setTab(t.dataset.tab); return; }
    if (e.target.closest("#only")) { onlyOpen = !onlyOpen; filter(); return; }
    if (e.target.closest("#acceptAll")) { acceptAll(); return; }
    const b = e.target.closest(".seg button");
    if (b) {
      const key = b.closest(".review").dataset.key;
      const [id, stage] = key.split("@");
      const s = D.shots.find(x => x.id === id);
      const prev = s && stage ? current(s, stage) : state[key];
      state[key] = { ...(prev || {}), status: prev?.status === b.dataset.v ? "" : b.dataset.v };
      pending.add(key);
      save(key);
    }
    const img = e.target.closest(".el-grid img, .thumbs img, .look img");
    const vid = document.getElementById("zoomVid");
    if (img) { vid.hidden = true; vid.pause(); const z = document.getElementById("zoomImg"); z.hidden = false; z.src = img.src; z.alt = img.alt; document.getElementById("zoom").showModal(); }
    const play = e.target.closest(".play");
    if (play) {
      document.getElementById("zoomImg").hidden = true; vid.hidden = false;
      const tin = Number(play.dataset.in || 0), tout = Number(play.dataset.out || 0);
      vid.src = play.dataset.video; vid.loop = !tout; vid.dataset.in = tin; vid.dataset.out = tout || "";
      vid.addEventListener("loadedmetadata", () => { vid.currentTime = tin; vid.play().catch(() => {}); }, { once: true });
      document.getElementById("zoom").showModal();
    }
    const inline = e.target.closest(".clip video");
    if (inline) inline.paused ? inline.play().catch(() => {}) : inline.pause();
  });
  const timers = {};
  document.addEventListener("input", e => {
    if (e.target.tagName !== "TEXTAREA") return;
    const key = e.target.id.slice(5);
    const [id, stage] = key.split("@");
    const s = D.shots.find(x => x.id === id);
    state[key] = { ...((s && stage ? current(s, stage) : state[key]) || {}), note: e.target.value };
    pending.add(key);
    clearTimeout(timers[key]);
    timers[key] = setTimeout(() => save(key), 700);
  });
  document.getElementById("zoomClose").addEventListener("click", () => document.getElementById("zoom").close());
  document.getElementById("zoom").addEventListener("close", () => document.getElementById("zoomVid").pause());
  // "▶ ช็อตนี้" loops the shot's own frames inside the padded clip.
  document.getElementById("zoomVid").addEventListener("timeupdate", e => { const v = e.target, out = Number(v.dataset.out); if (out && v.currentTime >= out) v.currentTime = Number(v.dataset.in || 0); });
  document.getElementById("copy").addEventListener("click", async () => {
    const lines = [`${D.deliverable} ${REV} review`];
    (D.questions || []).forEach(q => { const r = state[q.id] || {}; lines.push(`${q.id}\t-\t${r.status || "-"}\t${(r.note || "").replace(/\s+/g, " ")}`); });
    { const r = finalVerdict(); if (r?.status || r?.note) lines.push(`video\tfinal\t${r.status || "-"}\t${(r.note || "").replace(/\s+/g, " ")}`); }
    D.shots.forEach(s => SHOT_STAGES.forEach(k => { const r = current(s, k); if (r?.status || r?.note) lines.push(`${s.id}\t${k}\t${r.status || "-"}\t${(r.note || "").replace(/\s+/g, " ")}`); }));
    const text = lines.join("\n");
    const btn = document.getElementById("copy");
    try { await navigator.clipboard.writeText(text); btn.textContent = "คัดลอกแล้ว"; }
    catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); btn.textContent = "เลือกข้อความแล้ว กด ⌘C"; }
    setTimeout(() => (btn.textContent = "คัดลอกคำตอบทั้งหมด"), 2500);
  });
}

// Open on the tab this viewer used last, else the storyboard tab.
renderStatic();
try { tab = localStorage.getItem("sb-tab") || ""; } catch { tab = ""; }
if (!STAGES.includes(tab)) tab = "board";
renderRows(); wire(); count();

(async () => {
  const storeEl = document.getElementById("store");
  const apply = reviews => {
    Object.entries(reviews).forEach(([raw, v]) => {
      if (!v) return;
      // Pages built before the tabs stored storyboard verdicts as <shot>: read them as the storyboard tab.
      const key = !raw.includes("@") && D.shots.some(x => x.id === raw) ? raw + "@board" : raw;
      if (pending.has(key) || (key !== raw && state[key])) return;
      const [id, stage] = key.split("@");
      const want = expected(key), c = stage && stage !== "board" ? clipOf(shotOf(id) || {}, stage) : null;
      let clip = v.clip, ok = v.hash ? v.hash === want : v.rev === REV && (!c || v.clip === c.src);
      // A verdict saved before hashes counts for this revision (and its clip path): stamp it once so it carries over.
      if (ok && !v.hash) {
        if (c) clip = clipId(c);
        if (want && key === raw) put(key, { ...v, hash: want, clip }).catch(() => {});
      }
      if (ok) { state[key] = { status: v.status, note: v.note, clip, updatedAt: v.updatedAt, prev: v.prev }; delete stale[key]; }
      else if (v.hash && (v.status || v.note)) stale[key] = { status: v.status || "", note: v.note || "", rev: v.rev || "" };
      paint(key);
    });
    count();
  };
  // Published as a Claude Artifact: verdicts in its db, live across tabs and devices.
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  if (db) {
    online = true;
    storeEl.textContent = "คำตอบบันทึกอัตโนมัติ เอเจนต์อ่านได้";
    db.collection("reviews").onSnapshot(snap => {
      const reviews = {};
      snap.docs.forEach(d => { reviews[d.id] = d.data(); });
      apply(reviews);
    }, () => { storeEl.textContent = "เชื่อมที่เก็บคำตอบไม่ได้ ใช้ปุ่มคัดลอกส่งให้เอเจนต์"; });
    return;
  }
  // Served by serve.py: poll every 2 s; picks up answers from other tabs or devices, agent edits to reviews.json, and a rebuilt page.
  let etag = "", page = null;
  const poll = async () => {
    try {
      const r = await fetch("api/reviews", { headers: etag ? { "If-None-Match": etag } : {}, cache: "no-store" });
      if (r.status === 304) return;
      if (!r.ok) throw new Error(r.status);
      const body = await r.json();
      etag = r.headers.get("ETag") || "";
      if (!online) { online = true; storeEl.textContent = "คำตอบบันทึกอัตโนมัติ เอเจนต์อ่านได้"; }
      if (page === null) page = body.page;
      else if (body.page !== page) {
        // A rebuilt page reloads itself once nothing is unsaved or being typed.
        if (!pending.size && document.activeElement?.tagName !== "TEXTAREA") return location.reload();
        storeEl.textContent = "มีหน้าเวอร์ชันใหม่ จะโหลดใหม่เมื่อบันทึกเสร็จ";
        etag = "";
      }
      apply(body.reviews || {});
    } catch {
      etag = "";
      storeEl.textContent = online ? "ขาดการเชื่อมกับที่เก็บคำตอบ กำลังลองใหม่…" : "ไม่ได้เชื่อมที่เก็บคำตอบ คำตอบจะไม่ถูกบันทึก ใช้ปุ่มคัดลอกส่งให้เอเจนต์";
    } finally {
      setTimeout(poll, 2000);
    }
  };
  poll();
})();
</script>
</body>
</html>
